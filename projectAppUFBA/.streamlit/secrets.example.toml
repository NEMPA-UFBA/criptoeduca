# Modelo do gerenciador de segredos. Copie para secrets.toml e preencha.
#
#   cp .streamlit/secrets.example.toml .streamlit/secrets.toml
#
# O .gitignore do repositório já declara .streamlit/secrets.toml e .env, então
# o arquivo com os valores de verdade nunca entra no Git. Este modelo é a
# documentação do que o app espera encontrar.

# Senha do usuário "admin", usada UMA vez, no primeiro boot, só se o banco ainda
# não tiver o admin. Depois disso o que autentica é o hash bcrypt no banco e
# esta chave não é mais lida.
#
# Não existe valor padrão no código: se o banco estiver vazio e esta chave
# faltar, o app levanta RuntimeError explicando o que fazer, em vez de criar um
# admin com senha conhecida.
ADMIN_SENHA = "troque-esta-senha"
